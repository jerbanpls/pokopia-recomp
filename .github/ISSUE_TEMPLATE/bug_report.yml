name: Bug report
description: Something is wrong in the game or the launcher.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what happened, and where in the game.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Release or commit
      placeholder: e.g. v0.6.0-linux.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU and driver, Linux distribution, Proton version
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: pkp.log
      description: Drag in pkp.log (or setup.log for a Set up problem) from the session where it happened.
